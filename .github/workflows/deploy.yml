name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎月1日 朝9時(JST) にビルドし直す(制度データの更新反映用)
    - cron: "0 0 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 混雑でキュー待ちが長いとき、後続pushが待機中の実行を打ち消してしまうため false
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: サイトをビルド
        run: python build.py

      - name: 生成物を確認
        run: |
          test -f site/index.html
          test -f site/CNAME
          echo "生成ファイル数: $(ls site | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
